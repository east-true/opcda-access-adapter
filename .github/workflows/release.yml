name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version used for a packaging dry run
        required: true
        default: v0.0.0-dev
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Windows release assets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Select release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            value=$REF_VERSION
          else
            value=$DISPATCH_VERSION
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Require release tags to belong to main history
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build and verify release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./scripts/release/package.sh "$RELEASE_VERSION" dist "$GITHUB_SHA"
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir "${{ runner.temp }}/release-inspect"
          for archive in dist/*.zip; do
            unzip -tq "$archive"
            unzip -q "$archive" -d "${{ runner.temp }}/release-inspect"
          done
          test "$(find "${{ runner.temp }}/release-inspect" -type f -name 'opcda-access-adapter.exe' | wc -l)" -eq 2
          while IFS= read -r executable; do
            strings "$executable" | grep -Fx -- "$RELEASE_VERSION"
            strings "$executable" | grep -Fx -- "$GITHUB_SHA"
          done < <(find "${{ runner.temp }}/release-inspect" -type f -name 'opcda-access-adapter.exe' | sort)
          archive_version=${RELEASE_VERSION#v}
          go version -m "${{ runner.temp }}/release-inspect/opcda-access-adapter_${archive_version}_windows_386/opcda-access-adapter.exe" | grep -F 'GOARCH=386'
          go version -m "${{ runner.temp }}/release-inspect/opcda-access-adapter_${archive_version}_windows_amd64/opcda-access-adapter.exe" | grep -F 'GOARCH=amd64'
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish GitHub release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.package.outputs.version }}
          path: release
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/SHA256SUMS
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          options=(--verify-tag --generate-notes --title "$RELEASE_VERSION")
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" release/* "${options[@]}"
