name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Fuzz smoke tests
        # Every fuzz target in the repository, discovered rather than listed:
        # a target added later must not have to be remembered here.
        run: scripts/fuzz-smoke.sh
      - name: Vet
        run: go vet ./...

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release-shaped archives
        run: ./scripts/release/package.sh v0.0.0-dev dist "$GITHUB_SHA"
      - name: Verify archives and embedded metadata
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir "${{ runner.temp }}/release-inspect"
          for archive in dist/*.zip; do
            unzip -tq "$archive"
            unzip -q "$archive" -d "${{ runner.temp }}/release-inspect"
          done
          test "$(find "${{ runner.temp }}/release-inspect" -type f -name 'opcda-access-adapter.exe' | wc -l)" -eq 2
          test "$(find "${{ runner.temp }}/release-inspect" -type f -name 'THIRD_PARTY_NOTICES.md' | wc -l)" -eq 2
          test "$(find "${{ runner.temp }}/release-inspect" -type f -name 'opcda_access.proto' | wc -l)" -eq 2
          grep -F 'golang.org/x/sys' "${{ runner.temp }}/release-inspect/opcda-access-adapter_0.0.0-dev_windows_386/THIRD_PARTY_NOTICES.md"
          grep -F 'google.golang.org/grpc' "${{ runner.temp }}/release-inspect/opcda-access-adapter_0.0.0-dev_windows_386/THIRD_PARTY_NOTICES.md"
          grep -F 'BSD-3-Clause' "${{ runner.temp }}/release-inspect/opcda-access-adapter_0.0.0-dev_windows_amd64/THIRD_PARTY_NOTICES.md"
          while IFS= read -r executable; do
            strings "$executable" | grep -Fx -- "v0.0.0-dev"
            strings "$executable" | grep -Fx -- "$GITHUB_SHA"
          done < <(find "${{ runner.temp }}/release-inspect" -type f -name 'opcda-access-adapter.exe' | sort)
          go version -m "${{ runner.temp }}/release-inspect/opcda-access-adapter_0.0.0-dev_windows_386/opcda-access-adapter.exe" | grep -F 'GOARCH=386'
          go version -m "${{ runner.temp }}/release-inspect/opcda-access-adapter_0.0.0-dev_windows_amd64/opcda-access-adapter.exe" | grep -F 'GOARCH=amd64'

  windows-build:
    strategy:
      fail-fast: false
      matrix:
        arch: [386, amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cross-build Windows adapter
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: go build ./cmd/adapter

  windows-test:
    strategy:
      fail-fast: false
      matrix:
        arch: [386, amd64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Windows tests
        shell: pwsh
        env:
          GOARCH: ${{ matrix.arch }}
        run: go test ./...

  # Both jobs below verify this server against something outside it, and both
  # need network access to do it. That is a deliberate trade: a transient
  # fetch failure fails a job visibly and costs a re-run, while a check that
  # only runs when somebody remembers costs nothing until it matters. The
  # interop suite went nineteen pull requests failing on a stale assertion
  # before anyone ran it, which is what these two jobs exist to prevent.
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cross-check transcriptions against the OPC Foundation schema
        # Each source is verified against scripts/spec-check/digests.txt before
        # it is read, so an upstream change fails here as a reviewable event
        # rather than silently redefining what "conformant" means.
        run: python3 scripts/spec-check/check.py

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the open62541 client library
        # open62541 is the one client the runner cannot supply, so its
        # assertions ran nowhere automatic while the other two were gated.
        # That is the position the whole suite was in before it was added
        # here, and it had gone nineteen pull requests failing on a stale
        # assertion by then. The version is pinned to the one the
        # compatibility table records.
        run: |
          git clone --quiet --depth 1 --branch v1.5.7 \
            https://github.com/open62541/open62541.git "${{ runner.temp }}/open62541"
          cmake -S "${{ runner.temp }}/open62541" -B "${{ runner.temp }}/open62541/build" \
            -DCMAKE_BUILD_TYPE=Release -DUA_BUILD_EXAMPLES=OFF -DUA_ENABLE_AMALGAMATION=OFF
          cmake --build "${{ runner.temp }}/open62541/build" --parallel
      - name: Third-party OPC UA client interoperability
        # All three clients judge the UA frontend from outside: the runner
        # has Python and dotnet, and the step above builds open62541. The
        # runner still reports a skip rather than passing over one silently,
        # which is how the gap this step closes was found.
        env:
          INTEROP_O62_ROOT: ${{ runner.temp }}/open62541
        run: scripts/interop/run.sh
