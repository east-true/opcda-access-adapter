name: Feature request
description: Propose an in-scope improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The scope is OPC DA over local COM, with one explicitly selected HTTP/JSON, gRPC, OPC UA, or MCP stdio frontend per process.
        Other source protocols, persistent process data, name/value mapping, and multi-source aggregation are outside scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
