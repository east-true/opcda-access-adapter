name: Feature request
description: Propose an in-scope improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        범위는 OPC DA·로컬 COM 전용이며 한 프로세스는 명시적으로 선택한 HTTP/JSON, gRPC, OPC UA 또는 MCP stdio 하나만 실행합니다.
        다른 소스 프로토콜·데이터 저장·이름/값 매핑·다중 소스 집계는 범위에 포함하지 않습니다.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
