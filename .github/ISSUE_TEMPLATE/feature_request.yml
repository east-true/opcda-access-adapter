name: Feature request
description: Propose an in-scope improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The boundary is OPC DA only, local COM only, and one explicitly selected HTTP/JSON or unary gRPC frontend per process.
        Requests for OPC UA, Subscribe/streaming, other source protocols, persistence, mapping, or aggregation are currently out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
