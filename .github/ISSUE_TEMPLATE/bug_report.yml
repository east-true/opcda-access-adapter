name: Bug report
description: Report a reproducible defect in the adapter.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include process values, credentials, proprietary server data, or sensitive logs.
        For security issues, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse HEAD` or the release version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, architecture (386/amd64), and Go version if building from source.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the smallest reproducible request sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Include status codes and HRESULTs, but redact item values and secrets.
